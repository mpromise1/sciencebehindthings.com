<div id="kinematics-flowchart-widget" style="max-width: 760px; margin: 2rem auto; padding: 1.5rem; background: #0f172a; color: #f8fafc; border: 1px solid #334155; border-radius: 12px; font-family: system-ui, -apple-system, sans-serif;">
  <div style="text-align: center; margin-bottom: 1.5rem;">
    <span style="font-size: 0.75rem; text-transform: uppercase; letter-spacing: 0.1em; color: #38bdf8; font-weight: 700;">Interactive Decision Tool</span>
    <h3 style="margin: 0.25rem 0 0.5rem; font-size: 1.5rem; color: #ffffff;">Which Variable Is Completely Missing?</h3>
    <p style="margin: 0; font-size: 0.9rem; color: #94a3b8;">Click the one variable that is neither given nor asked for in your problem.</p>
  </div>

  <div style="display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 0.75rem; margin-bottom: 1.5rem;">
    <button onclick="selectMissing('dx')" id="btn-dx" class="kf-btn" style="padding: 0.85rem; background: #1e293b; color: #f8fafc; border: 2px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
      No Displacement<br><span style="color: #38bdf8; font-size: 1.1rem;">(No &Delta;x)</span>
    </button>
    <button onclick="selectMissing('v')" id="btn-v" class="kf-btn" style="padding: 0.85rem; background: #1e293b; color: #f8fafc; border: 2px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
      No Final Velocity<br><span style="color: #38bdf8; font-size: 1.1rem;">(No v)</span>
    </button>
    <button onclick="selectMissing('t')" id="btn-t" class="kf-btn" style="padding: 0.85rem; background: #1e293b; color: #f8fafc; border: 2px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
      No Time<br><span style="color: #38bdf8; font-size: 1.1rem;">(No t)</span>
    </button>
    <button onclick="selectMissing('a')" id="btn-a" class="kf-btn" style="padding: 0.85rem; background: #1e293b; color: #f8fafc; border: 2px solid #334155; border-radius: 8px; cursor: pointer; font-weight: 600; transition: all 0.2s;">
      No Acceleration<br><span style="color: #38bdf8; font-size: 1.1rem;">(No a)</span>
    </button>
  </div>

  <div id="kf-result" style="padding: 1.25rem; background: #1e293b; border-left: 4px solid #38bdf8; border-radius: 8px; text-align: center;">
    <div id="kf-eq-label" style="font-size: 0.85rem; color: #38bdf8; font-weight: 700; text-transform: uppercase; margin-bottom: 0.4rem;">Equation 1 (Missing &Delta;x)</div>
    <div id="kf-eq-math" style="font-size: 1.6rem; font-weight: 700; color: #ffffff; margin-bottom: 0.5rem; font-family: 'Times New Roman', serif;">
      v = v<sub>0</sub> + at
    </div>
    <div id="kf-eq-desc" style="font-size: 0.9rem; color: #cbd5e1;">
      Use this when you have or want velocity, acceleration, and time without needing distance.
    </div>
  </div>
</div>

<script>
  const eqData = {
    dx: {
      label: "Equation 1 (Missing Δx)",
      math: "v = v<sub>0</sub> + at",
      desc: "Use this when you have or want velocity, acceleration, and time without needing distance."
    },
    v: {
      label: "Equation 2 (Missing v)",
      math: "&Delta;x = v<sub>0</sub>t + &frac12;at<sup>2</sup>",
      desc: "Use this when you need displacement or time, and final velocity is never mentioned."
    },
    t: {
      label: "Equation 3 (Missing t)",
      math: "v<sup>2</sup> = v<sub>0</sub><sup>2</sup> + 2a&Delta;x",
      desc: "Use this whenever time (t) is completely absent from the problem statement."
    },
    a: {
      label: "Equation 4 (Missing a)",
      math: "&Delta;x = &frac12;(v<sub>0</sub> + v)t",
      desc: "Use this when acceleration is missing or constant, and you are working with average velocity."
    }
  };

  function selectMissing(key) {
    document.querySelectorAll('.kf-btn').forEach(btn => {
      btn.style.borderColor = '#334155';
      btn.style.background = '#1e293b';
    });
    const activeBtn = document.getElementById('btn-' + key);
    activeBtn.style.borderColor = '#38bdf8';
    activeBtn.style.background = '#0284c722';

    document.getElementById('kf-eq-label').innerHTML = eqData[key].label;
    document.getElementById('kf-eq-math').innerHTML = eqData[key].math;
    document.getElementById('kf-eq-desc').innerHTML = eqData[key].desc;
  }
  selectMissing('dx');
</script>
